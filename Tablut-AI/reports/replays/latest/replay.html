<main><h1>Tablut · 双方逐步棋谱</h1><p class="muted">坐标为从 0 开始的 [行, 列]。箭头表示本步移动；绿框为落点，红色叉号为被吃棋子的位置。棋谱记录的是实际动作，不包含 AI 的思考理由。</p>
<div class="panel toolbar"><label>选择比赛 <select id="game"></select></label><button id="download">下载 JSON 棋谱</button><span id="summary"></span></div>
<div class="layout"><section class="panel"><div class="toolbar"><button id="first">初始局面</button><button id="prev">上一步</button><button id="play">自动播放</button><button id="next">下一步</button><button id="last">终局</button></div><input id="slider" aria-label="选择半步" type="range" min="0" value="0"><div class="toolbar"><strong id="step"></strong><label><input type="checkbox" id="before">显示本步落子前的棋盘</label></div><div id="board"></div><div id="description"></div><p class="muted">A 蓝色：进攻方；D 金色：防守方；K 红色：国王；X：空城堡。可用键盘 ← → 翻步。</p></section><aside class="panel"><h2>双方走法</h2><p class="muted">点击任意记录跳到该局面。</p><div class="move-list" id="moves"></div></aside></div>
<details class="panel" id="all"><summary>展开整局图解：每一步的棋盘都画出来</summary><p class="muted">含初始局面及全部落子后棋盘，点击小图可在主棋盘查看。</p><div id="gallery" class="gallery"></div></details>
<p class="muted">此文件已内嵌 games.json 数据，可直接双击离线打开，无需启动服务器。</p></main>

<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);

function diagram(board,event){

 for(let i=0;i<9;i++){svg.append(element('text',{x:i*10+15,y:7,'text-anchor':'middle','font-size':3.5,fill:'#64748b'},i));svg.append(element('text',{x:5,y:i*10+16,'text-anchor':'middle','font-size':3.5,fill:'#64748b'},i))}
 for(let r=0;r<9;r++)for(let c=0;c<9;c++){
  const x=10+c*10,y=10+r*10,s=board[r][c];
  svg.append(element('rect',{x,y,width:10,height:10,fill:r===4&&c===4?'#b6bcc6':(r+c)%2?'#e4d5bc':'#f4ead8',stroke:'#fff','stroke-width':.25}));
  if(s==='A'||s==='D'||s==='K'){

}
function jump(n){step=Math.max(0,Math.min(current().moves.length,n));render()}
function buildGallery(){const g=current();$('gallery').replaceChildren();[null,...g.moves].forEach((e,i)=>{const box=document.createElement('div');box.className='frame';const p=document.createElement('p');p.textContent=e?label(e):'0. 初始局面';box.append(p,diagram(e?e.board_after:g.initial_board,e));box.tabIndex=0;box.onclick=()=>{stop();jump(i);$('board').scrollIntoView({behavior:'smooth',block:'center'})};box.onkeydown=ev=>{if(ev.key==='Enter')box.click()};$('gallery').append(box)})}
function load(){stop();step=0;const g=current();$('slider').max=g.moves.length;$('summary').textContent=`我方执${names[g.our_side]} · ${names[g.result.winner]}获胜 / ${reasons[g.result.reason]||g.result.reason} · ${g.accepted_moves} 次有效行动`;
 $('moves').replaceChildren();[null,...g.moves].forEach((e,i)=>{const b=document.createElement('button');b.dataset.step=i;b.textContent=e?label(e):'0. 初始局面';b.onclick=()=>{stop();jump(i)};$('moves').append(b)});if($('all').open)buildGallery();render()}
for(const[i,g]of data.games.entries()){const o=document.createElement('option');o.value=i;o.textContent=`第 ${g.game} 局 · A ${g.strategies.A} vs D ${g.strategies.D}`;$('game').append(o)}
$('game').onchange=()=>{index=Number($('game').value);load()};$('first').onclick=()=>{stop();jump(0)};$('last').onclick=()=>{stop();jump(current().moves.length)};$('prev').onclick=()=>{stop();jump(step-1)};$('next').onclick=()=>{stop();jump(step+1)};$('slider').oninput=()=>{stop();jump(Number($('slider').value))};$('before').onchange=render;
$('play').onclick=()=>{if(timer){stop();return}if(step===current().moves.length)jump(0);$('play').textContent='暂停';timer=setInterval(()=>{jump(step+1);if(step===current().moves.length)stop()},650)};
$('all').ontoggle=()=>{if($('all').open)buildGallery()};document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight'){stop();jump(step+1)}if(e.key==='ArrowLeft'){stop();jump(step-1)}});
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='games.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
load();
</script></html>
